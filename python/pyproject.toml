[project]
name = "agent-engineering-learning"
version = "0.1.0"
description = "Agent 工程化学习示例与实验代码"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv",
  "langchain",
  "langchain-core",
  "langchain-classic",
  "langchain-openai",
  "langchain-ollama",
  "langchain-text-splitters",
  "langchain-qdrant",
  "langgraph",
  "flask",
  "pandas",
  "pypdf",
  "docx2txt",
  "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_learning"]

